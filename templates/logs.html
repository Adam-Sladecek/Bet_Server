<!DOCTYPE html>
<html>
<head>
    <title>Logs</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }

        pre {
            white-space: pre-wrap;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 1000px;
            margin: 0 auto;
        }

        .info {
            background-color: #e6f7ff; /* Light blue for info messages */
        }

        .warning {
            background-color: #fff4e6; /* Light orange for warning messages */
        }

        .error {
            background-color: #ffd2d2; /* Light red for error messages */
        }
    </style>
</head>
<body>
    <h1>Logs</h1>
    <div>
        <pre>{{ logs }}</pre>
    </div>
</body>
</html>
