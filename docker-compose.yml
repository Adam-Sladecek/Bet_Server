version: '3.8'

services:
  web:
    build:
      context: .
    volumes:
      - ./scrape_server:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DEBUG=1
      - POSTGRES_HOST=localhost
      - POSTGRES_DB=ev_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    depends_on:
      database:
        condition: service_healthy

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=ev_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456

volumes:
  postgres_data:
