version: '3.8'

services:
  web:
    image: betserver
    build:
      context: .
    ports:
      - "8000:8000"
    command: ["sh", "-c", "chmod +x /app/start.sh && /app/start.sh"]
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/scrape_server
      - DJANGO_SETTINGS_MODULE=scrape_server.settings
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

volumes:
  postgres_data:
